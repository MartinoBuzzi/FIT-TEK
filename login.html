<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accedi o registrati su FIT-TEK">
  <title>Accedi - FIT-TEK</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="d-flex flex-column min-vh-100 bg-dark-subtle">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">FIT-TEK</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
      </ul>
      <ul class="navbar-nav align-items-center gap-2">

        <li class="nav-item" id="navGuestArea" style="display:none;">
          <a class="btn btn-custom-login btn-sm" href="login.html">Accedi</a>
        </li>

        <li class="nav-item" id="navUserArea" style="display:none;">
          <div class="d-flex align-items-center gap-2">
          <button class="btn btn-link nav-link text-white position-relative px-1" onclick="apriCarrello()" title="Il tuo carrello">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
              <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success" style="font-size:.65rem; display:none;">0</span>
          </button>
          <span class="text-white small">Ciao, <strong id="navUsername"></strong></span>
          <a class="btn btn-outline-secondary btn-sm logoutLink" href="#">Logout</a>
        
          </div>
        </li>

        <li class="nav-item" id="navAdminArea" style="display:none;">
          <div class="d-flex align-items-center gap-2">
          <a class="nav-link" href="admin.html">Pannello Admin</a>
          <a class="btn btn-outline-danger btn-sm logoutLink" href="#">Logout</a>
        
          </div>
        </li>

      </ul>
    </div>
  </div>
</nav>

<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" style="width: 420px; max-width: 95vw;">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title fw-bold">Il tuo carrello</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body" id="cart-body"></div>
  <div class="p-3" id="cart-footer"></div>
</div>

<main class="flex-grow-1 d-flex align-items-center py-5">
  <div class="container" style="max-width: 440px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold text-center mb-4">Accedi al tuo account</h4>

        <ul class="nav nav-pills nav-justified mb-4" id="authTabs">
          <li class="nav-item">
            <button class="nav-link active" id="tabLogin">Accedi</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tabRegistrati">Registrati</button>
          </li>
        </ul>

        <div class="alert d-none" id="authMessage" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="loginEmail" class="form-label small">Email</label>
            <input type="email" id="loginEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label small">Password</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Accedi</button>
        </form>

        <form id="registratiForm" class="d-none">
          <div class="mb-3">
            <label for="regUsername" class="form-label small">Nome utente</label>
            <input type="text" id="regUsername" class="form-control" required minlength="2">
          </div>
          <div class="mb-3">
            <label for="regEmail" class="form-label small">Email</label>
            <input type="email" id="regEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="regPassword" class="form-label small">Password</label>
            <input type="password" id="regPassword" class="form-control" required minlength="6">
          </div>
          <button type="submit" class="btn btn-success w-100">Crea account</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="footer mt-auto py-4 bg-black border-top">
  <div class="container text-center">
    <p class="text-white-50 small mb-0">&copy; 2026 FIT-TEK — Martino Buzzi &amp; Martina Ciacco</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/nav-auth.js?v=3"></script>
<script type="module" src="js/cart-ui.js?v=3"></script>
<script type="module">
  import { accedi, registrati, messaggioErroreAuth } from "./js/auth.js?v=3";

  const message = document.getElementById("authMessage");
  const tabLogin = document.getElementById("tabLogin");
  const tabRegistrati = document.getElementById("tabRegistrati");
  const loginForm = document.getElementById("loginForm");
  const registratiForm = document.getElementById("registratiForm");

  function mostraMessaggio(testo, tipo) {
    message.textContent = testo;
    message.className = "alert alert-" + (tipo === "success" ? "success" : "danger");
  }

  tabLogin.addEventListener("click", () => {
    tabLogin.classList.add("active");
    tabRegistrati.classList.remove("active");
    loginForm.classList.remove("d-none");
    registratiForm.classList.add("d-none");
    message.className = "alert d-none";
  });

  tabRegistrati.addEventListener("click", () => {
    tabRegistrati.classList.add("active");
    tabLogin.classList.remove("active");
    registratiForm.classList.remove("d-none");
    loginForm.classList.add("d-none");
    message.className = "alert d-none";
  });

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
      await accedi(email, password);
      mostraMessaggio("Accesso effettuato, reindirizzamento in corso...", "success");
      setTimeout(() => { window.location.href = "shop.html"; }, 800);
    } catch (errore) {
      mostraMessaggio(messaggioErroreAuth(errore), "error");
    }
  });

  registratiForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const username = document.getElementById("regUsername").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    try {
      await registrati(username, email, password);
      mostraMessaggio("Account creato, reindirizzamento in corso...", "success");
      setTimeout(() => { window.location.href = "shop.html"; }, 800);
    } catch (errore) {
      mostraMessaggio(messaggioErroreAuth(errore), "error");
    }
  });
</script>
</body>
</html>
